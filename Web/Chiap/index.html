<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiap</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="src/styles/alert.css">
</head>
<body>
  <div class="container" id="container">
    <div class="form-container sign-up-container">
      <form id="signUpForm" class="auth-form signup-form">
        <h1>Create Account</h1>
        <span><br></span>
        <input type="text" id="name" placeholder="Name" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="sign-up-button">Create account</button>
      </form>
    </div>
    <div class="form-container sign-in-container">
      <form id="signInForm" class="auth-form signin-form">
        <h1>Login</h1>
        <span><br></span>
        <input type="email" id="signInEmail" placeholder="Email" required />
        <input type="password" id="signInPassword" placeholder="Password" required />
        <a href="./components/forgotPassword.html">Forgot your password?</a>
        <button type="submit">Login</button>
      </form>
    </div>
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h1>Welcome Back!</h1>
          <p>To keep connected with us please login with your personal info</p>
          <button class="ghost" id="signIn">Login</button>
        </div>
        <div class="overlay-panel overlay-right">
          <h1>Hello, Friend!</h1>
          <p>Enter your personal details and start journey with us</p>
          <button class="ghost" id="signUp">Create account</button>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; bottom: 40vh;position: relative ; z-index: 5;">
      <p class="mobile-switch">
        Don’t have an account?
        <span id="mobileSignUp">Sign up</span>
      </p>
      <p class="mobile-switch">
        Already have an account?
        <span id="mobileSignIn">Sign in</span>
      </p>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  
    

  <script type="module" src="index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
</body>
</html>
